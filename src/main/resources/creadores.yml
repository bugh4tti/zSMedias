# =====================================================
#  zSMedias - creadores.yml
#  Soporta: &colores, &#RRGGBB y #RRGGBB
#
#  Placeholders:
#   {creator}        nombre del creador
#   {creator_color}  color hex del creador
#   {votes}          cantidad de jugadores que lo eligieron
#   {votes_text}     "usuario eligió" / "usuarios eligieron"
#   {status}         estado del jugador (ver menu.status)
#   {player}         jugador (en rewards, daily, mensajes y títulos)
#   En los hitos (milestones), {votes} es la cantidad de votos del hito.
#
#  texture: valor "Value" (base64) de la cabeza en minecraft-heads.com.
#  Si lo dejas vacío o con PEGAR_TEXTURE_AQUI se usa una cabeza normal.
#  Con /creadores add <id> <nombre> se copia la textura de la cabeza
#  que tengas en la mano.
# =====================================================

menu:
  title: "#FFD000&lC#FFC200&lR#FFB500&lE#FFA800&lA#FF9A00&lD#FF8D00&lO#FF7F00&lR#FF7200&lE#FF6400&lS"
  rows: 4
  glow-selected: true
  filler:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  close-button:
    enabled: true
    slot: 31
    material: BARRIER
    name: "&c&lCerrar"
    lore:
      - "&7Click para cerrar el menú."
  # Recompensa diaria (también con /creadores claim).
  # El cooldown y el interruptor general (creadores.daily-enabled) se editan en config.yml
  # o desde /media config. Si el interruptor está en false, este botón se oculta solo.
  claim-button:
    enabled: true
    slot: 32
    material: CHEST
    name: "&6&lRecompensa diaria"
    lore:
      - "&7Reclama una recompensa cada 24 horas"
      - "&7por apoyar a tu creador."
      - " "
      - "{status}"
    status:
      ready: "&a▶ Click para reclamar"
      cooldown: "&c✖ Disponible en &f{time}"
      no-creator: "&c✖ Elige un creador primero"
      no-reward: "&c✖ Tu creador no tiene recompensa diaria"
  status:
    available: "&a▶ Click izquierdo para elegir"
    selected: "&a✔ Este es tu creador"
    locked: "&c✖ Ya elegiste a otro creador"

confirm-menu:
  title: "&8Confirmar creador"
  rows: 3
  head-slot: 13
  filler:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  confirm:
    slot: 11
    material: LIME_STAINED_GLASS_PANE
    name: "&a&l✔ CONFIRMAR"
    lore:
      - "&7Elegirás a {creator_color}{creator}&7."
      - "&cNo podrás cambiarlo después."
  cancel:
    slot: 15
    material: RED_STAINED_GLASS_PANE
    name: "&c&l✖ CANCELAR"
    lore:
      - "&7Volver al menú de creadores."

# =====================================================
#  Lista de creadores (puedes agregar todos los que quieras)
# =====================================================
creators:
  domix:
    name: "Domix"
    color: "#FF4D4D"
    slot: 12
    texture: "PEGAR_TEXTURE_AQUI"
    display-name: "{creator_color}&l{creator}"
    lore:
      - "&8Creador de contenido"
      - " "
      - "&f{votes} {votes_text} &7a {creator_color}{creator}"
      - " "
      - "&7Recompensa al elegir:"
      - " &8• &f5 Diamantes"
      - " &8• &f$1,000"
      - " "
      - "{status}"
      - "&eClick derecho &7para ver sus canales"
    # Nick de Minecraft del creador. Sirve para detectar cuando está en directo
    # y activar el bonus de sus fans (ver 'bonus' en config.yml). Déjalo vacío si no aplica.
    player: "Domix"
    # Tag opcional para %zsmedias_creator_tag% (si lo dejas vacío usa creadores.default-tag de config.yml)
    tag: "&8[#FF4D4D&lFan de Domix&8]"
    # Links (deja vacío "" los que no use). Click derecho en el menú los envía al chat.
    links:
      youtube: "https://youtube.com/@domix"
      twitch: ""
      tiktok: ""
      kick: ""
    # Comandos que ejecuta la consola al elegir (sin /)
    rewards:
      - "give {player} diamond 5"
      - "eco give {player} 1000"
    # Comandos de la recompensa diaria (/creadores claim). Vacío = sin recompensa diaria.
    daily:
      - "give {player} gold_ingot 5"
      - "eco give {player} 250"
    # Hitos: cuando el creador llega a esa cantidad de votos, TODOS sus fans cobran la recompensa
    # (los conectados al instante y el resto cuando entren al servidor).
    milestones:
      10:
        message:
          - " "
          - "&6&l★ &fHito de {creator_color}&l{creator} &fdesbloqueado: &e{votes} votos&f."
          - " "
        rewards:
          - "give {player} diamond 10"
      50:
        message:
          - " "
          - "&6&l★ &fHito de {creator_color}&l{creator} &fdesbloqueado: &e{votes} votos&f."
          - " "
        rewards:
          - "give {player} diamond 32"
          - "eco give {player} 5000"
      100:
        message:
          - " "
          - "&6&l★ &fHito de {creator_color}&l{creator} &fdesbloqueado: &e{votes} votos&f."
          - " "
        rewards:
          - "give {player} netherite_ingot 4"
          - "eco give {player} 25000"
    # Opcionales: si los quitas se usan los de lang/messages_<idioma>.yml
    message:
      - " "
      - "&a✔ &fElegiste a #FF4D4D&lDomix &fcomo tu creador."
      - "&7¡Gracias por apoyar a Domix!"
      - " "
    title: "#FF4D4D&lDOMIX"
    subtitle: "&f¡Gracias por apoyar!"

  ejemplo:
    name: "Creador Ejemplo"
    color: "#00C6FF"
    slot: 14
    texture: "PEGAR_TEXTURE_AQUI"
    display-name: "{creator_color}&l{creator}"
    lore:
      - "&8Creador de contenido"
      - " "
      - "&f{votes} {votes_text} &7a {creator_color}{creator}"
      - " "
      - "&7Recompensa al elegir:"
      - " &8• &f5 Diamantes"
      - " "
      - "{status}"
      - "&eClick derecho &7para ver sus canales"
    player: ""
    tag: ""
    links:
      youtube: ""
      twitch: ""
      tiktok: ""
      kick: ""
    rewards:
      - "give {player} diamond 5"
    daily: []
