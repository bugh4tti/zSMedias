name: zSMedias
main: com.zs.medias.ZSMedias
version: 1.1.0
api-version: '1.16'
author: Bughatti
description: Directos, videos, anuncios y menú de creadores.
softdepend: [PlaceholderAPI]

commands:
  media:
    description: Comando principal de zSMedias.
    aliases: [medias]
    usage: /media help
  directo:
    description: Anuncia un directo en el chat.
    usage: /directo <plataforma> [link]
  video:
    description: Anuncia un video en el chat.
    usage: /video <plataforma> <link>
  anuncio:
    description: Envía un anuncio a toda la modalidad.
    usage: /anuncio <contenido>
  creadores:
    description: Abre el menú de creadores.
    aliases: [creators]
    usage: /creadores [top|claim]

permissions:
  zsmedias.admin:
    description: Administración de zSMedias (reload, config, add, remove, reset).
    default: op
  zsmedias.directo:
    description: Usar /directo.
    default: true
  zsmedias.video:
    description: Usar /video.
    default: true
  zsmedias.anuncio:
    description: Usar /anuncio.
    default: true
  zsmedias.anuncio.color:
    description: Usar colores y hex dentro de /anuncio.
    default: true
  zsmedias.bypass.links:
    description: Poner links en /anuncio aunque estén bloqueados.
    default: op
  zsmedias.cooldown.bypass:
    description: Ignorar todos los cooldowns.
    default: op
  zsmedias.vincular:
    description: Vincular canales con /media vincular.
    default: true
  zsmedias.toggle:
    description: Silenciar los anuncios con /media toggle.
    default: true
  zsmedias.historial:
    description: Ver el historial con /media historial.
    default: op
  zsmedias.creadores:
    description: Abrir el menú /creadores.
    default: true
  zsmedias.creadores.claim:
    description: Reclamar la recompensa diaria con /creadores claim.
    default: true
  zsmedias.creadores.change:
    description: Cambiar de creador después de elegir.
    default: op
